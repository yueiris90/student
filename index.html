<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学情报告 - 模拟演示</title>
<style>

:root {
  --green: #79BDEB;
  --bg: #F1F9FF;
  --line: #E8F1F8;
  --muted: #9AA8B4;
  --soft: #E1F3FF;
}

/* 王橹杰：浅蓝白主题 */
body.theme-wang {
  --green: #79BDEB;
  --bg: #F1F9FF;
  --line: #E8F1F8;
  --muted: #9AA8B4;
  --soft: #E1F3FF;
}

/* 穆祉丞：浅粉白主题 */
body.theme-mu {
  --green: #EFA2BD;
  --bg: #FFF4F8;
  --line: #F9E9F0;
  --muted: #B5A0AA;
  --soft: #FFE7F0;
}

/* 考试图标 */
.exam-icon {
  background: var(--soft);
  color: var(--green);
}

/* 个人头像 */
.avatar,
.account-avatar {
  background: var(--soft);
  color: var(--green);
}

/* 底部导航和科目选中状态 */
.nav-item.active,
.subject-tab.active {
  color: var(--green);
}

/* 科目下划线 */
.subject-tab.active:after {
  background: var(--green);
}

/* 英语成绩趋势图 */
.chart-note {
  color: var(--green);
}

.grade-bar {
  opacity: 0.8;
}
body {
  margin:0;
  font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
  color:#282828;
  background:#e9eaed;
}
button {font:inherit;cursor:pointer}
.app {
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  margin:auto;
  background:var(--bg);
  padding-bottom:76px;
}
.demo {
  background:#f8faf9;
  text-align:center;
  color:#aaa;
  font-size:10px;
  padding:5px;
}
.header {
  height:56px;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  font-size:18px;
  font-weight:500;
  border-bottom:1px solid #f2f2f2;
}
.back {
  position:absolute;
  left:17px;
  border:0;
  background:none;
  font-size:31px;
  line-height:1;
  padding:0 8px;
  color:#333;
}
.page {display:none}
.page.active {display:block}
.section-title {
  padding:23px 19px 14px;
  color:#aaa;
  font-size:14px;
}
.exam-list {background:#fff}
.exam-row {
  min-height:91px;
  padding:17px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  border-bottom:1px solid #f3f3f3;
  cursor:pointer;
}
.exam-icon {
  width:45px;
  height:45px;
  border-radius:10px;
  background:#e7f8f4;
  color:var(--green);
  display:grid;
  place-items:center;
  flex-shrink:0;
}
.exam-info {
  flex:1;
  min-width:0;
  font-size:14px;
  line-height:1.6;
}
.exam-sub {
  font-size:12px;
  color:#b3b3b3;
  margin-top:5px;
}
.arrow {
  color:#b5b5b5;
  font-size:23px;
  font-weight:300;
}
.exam-footer {
  text-align:center;
  font-size:12px;
  color:#aaa;
  padding:28px 0 35px;
}
.subject-tabs {
  display:flex;
  background:#fff;
  overflow-x:auto;
  white-space:nowrap;
  scrollbar-width:none;
  border-bottom:1px solid #f1f1f1;
}
.subject-tabs::-webkit-scrollbar {display:none}
.subject-tab {
  border:0;
  background:none;
  padding:16px 20px;
  flex-shrink:0;
  font-size:16px;
  position:relative;
}
.subject-tab.active {
  color:var(--green);
  font-weight:600;
}
.subject-tab.active:after {
  content:"";
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  height:3px;
  width:34px;
  border-radius:4px;
  background:var(--green);
}
.report-area {padding:13px}
.report-card {
  background:white;
  border-radius:13px;
  padding:23px;
  margin-bottom:14px;
}
.score-label {
  color:#aaa;
  font-size:16px;
}
.big-score {
  display:flex;
  align-items:baseline;
  gap:5px;
  margin:20px 0 15px;
}
.big-score strong {
  font-size:66px;
  font-weight:700;
  letter-spacing:-2px;
  color:#151515;
}
.big-score .unit {font-size:17px}
.big-score .full {
  color:#aaa;
  font-size:15px;
  margin-left:14px;
}
.rank-row {
  border-top:1px solid #f0f0f0;
  border-bottom:1px solid #f0f0f0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:19px 0;
}
.rank-row strong {font-size:23px}
.rank-row small {color:#aaa;font-size:15px}
.subject-head,.score-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.subject-head {
  color:#aaa;
  font-size:14px;
  padding:22px 0 12px;
}
.score-row {
  height:70px;
  border-bottom:1px solid #f0f0f0;
  font-size:16px;
}
.score-row .score-right {width:110px}
.score-row .score-right span {color:#aaa}
.card-heading {
  font-size:20px;
  font-weight:600;
  margin:0 0 20px;
}
.segment {
  display:flex;
  margin:0 0 25px;
}
.segment button {
  border:1px solid var(--green);
  color:var(--green);
  background:white;
  padding:9px 24px;
}
.segment button:first-child {
  border-radius:5px 0 0 5px;
}
.segment button:last-child {
  border-radius:0 5px 5px 0;
}
.segment button.active {
  background:var(--green);
  color:white;
}
.grade-bar {
  height:12px;
  background:linear-gradient(
    90deg,#fa476b,#ff9c00,#ffd200,
    #8bd044,#00bdaf
  );
  border-radius:20px;
  margin:15px 8px 4px;
}
.grade-labels {
  display:flex;
  justify-content:space-around;
  font-size:12px;
  color:#555;
}
.chart {
  width:100%;
  height:205px;
  display:block;
  margin-top:25px;
}
.chart-dates {
  display:flex;
  justify-content:space-between;
  color:#aaa;
  font-size:11px;
}
.chart-note {
  margin-top:22px;
  font-size:12px;
  color:var(--green);
}
.paper-placeholder {
  min-height:220px;
  border:1px dashed #ddd;
  background:#fafafa;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:13px;
  text-align:center;
}
.my-profile {
  background:white;
  padding:29px 20px;
}
.profile-flex {
  display:flex;
  align-items:center;
  gap:15px;
}
.avatar {
  width:65px;
  height:65px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#e6f7f2;
  color:var(--green);
  font-size:30px;
  font-weight:600;
  flex-shrink:0;
}
.profile-name {
  font-size:21px;
  font-weight:600;
}
.tag {
  font-size:11px;
  color:#c18b35;
  background:#fff4e6;
  padding:3px 8px;
  border-radius:15px;
  margin-left:7px;
  font-weight:400;
}
.profile-detail {
  font-size:12px;
  color:#999;
  margin-top:7px;
}
.menu-group {
  background:white;
  margin-top:12px;
}
.menu-row {
  display:flex;
  align-items:center;
  min-height:58px;
  padding:0 19px;
  gap:15px;
  border-bottom:1px solid #f1f1f1;
  font-size:15px;
}
.menu-icon {
  width:25px;
  text-align:center;
  color:#555;
  font-size:19px;
}
.menu-name {flex:1}
.menu-arrow {color:#bbb;font-size:22px}
.clickable {cursor:pointer}
.bottom-nav {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  max-width:480px;
  width:100%;
  height:70px;
  padding-bottom:env(safe-area-inset-bottom);
  background:white;
  border-top:1px solid #eee;
  display:flex;
  z-index:10;
}
.nav-item {
  flex:1;
  border:0;
  background:none;
  color:#aaa;
  font-size:12px;
}
.nav-item.active {color:var(--green)}
.nav-icon {
  display:block;
  font-size:25px;
  margin-bottom:3px;
}
.overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.36);
  z-index:20;
}
.overlay.show {display:block}
.account-sheet {
  position:fixed;
  left:50%;
  bottom:0;
  transform:translate(-50%,105%);
  width:100%;
  max-width:480px;
  background:white;
  border-radius:20px 20px 0 0;
  padding:17px 20px 30px;
  padding-bottom:calc(30px + env(safe-area-inset-bottom));
  z-index:21;
  transition:transform .28s;
}
.account-sheet.show {
  transform:translate(-50%,0);
}
.handle {
  width:38px;
  height:4px;
  background:#ddd;
  border-radius:5px;
  margin:0 auto 19px;
}
.sheet-title {
  text-align:center;
  font-size:17px;
  margin-bottom:13px;
}
.account-row {
  display:flex;
  width:100%;
  gap:14px;
  align-items:center;
  padding:16px 0;
  background:white;
  border:0;
  border-bottom:1px solid #f1f1f1;
  text-align:left;
}
.account-avatar {
  width:55px;
  height:55px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#e6f7f2;
  color:var(--green);
  font-size:25px;
  font-weight:bold;
}
.account-info {flex:1}
.account-name {
  font-size:18px;
  font-weight:600;
}
.account-school {
  color:#999;
  font-size:12px;
  margin-top:8px;
}
.account-check {
  width:25px;
  height:25px;
  border:2px solid #ccc;
  border-radius:50%;
}
.account-check.selected {
  border:0;
  background:var(--green);
  color:white;
  display:grid;
  place-items:center;
}
.cancel {
  width:100%;
  margin-top:19px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#f5f6f7;
  color:#555;
}
.toast {
  display:none;
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translateX(-50%);
  background:rgba(35,35,35,.88);
  color:white;
  padding:12px 22px;
  border-radius:22px;
  font-size:14px;
  z-index:40;
  white-space:nowrap;
}
@media(min-width:600px) {
  .app {box-shadow:0 0 25px #0000000a}
}
</style>
</head>
<body>


<div class="app">
  <header class="header">
    <button class="back" id="backBtn" onclick="goBack()">‹</button>
    <span id="pageTitle">学情报告</span>
  </header>

  <section class="page" id="examPage">
    <div class="section-title">考试报告</div>
    <div class="exam-list" id="examList"></div>
    <div class="exam-footer">仅可查看一学年内考试</div>
  </section>

  <section class="page active" id="reportPage">
    <div class="subject-tabs" id="subjectTabs"></div>
    <div class="report-area" id="reportContent"></div>
  </section>

  <section class="page" id="myPage">
    <div class="my-profile">
      <div class="profile-flex">
        <div class="avatar" id="profileAvatar"></div>
        <div>
          <div class="profile-name">
            <span id="profileName"></span>
            <span class="tag">学生</span>
          </div>
          <div class="profile-detail" id="profileSchool"></div>
          <div class="profile-detail" id="profileClass"></div>
          <div class="profile-detail" id="profileId"></div>
        </div>
      </div>
    </div>

    <div class="menu-group">
      <div class="menu-row">
        <span class="menu-icon">▦</span>
        <span class="menu-name">我的二维码</span>
        <span class="menu-arrow">›</span>
      </div>
      <div class="menu-row">
        <span class="menu-icon">⌖</span>
        <span class="menu-name">收货地址</span>
        <span class="menu-arrow">›</span>
      </div>
    </div>

    <div class="menu-group">
      <div class="menu-row">
        <span class="menu-icon">☏</span>
        <span class="menu-name">客服中心</span>
        <span class="menu-arrow">›</span>
      </div>
      <div class="menu-row">
        <span class="menu-icon">ⓘ</span>
        <span class="menu-name">投诉举报</span>
        <span class="menu-arrow">›</span>
      </div>
      <div class="menu-row">
        <span class="menu-icon">♧</span>
        <span class="menu-name">意见反馈</span>
        <span class="menu-arrow">›</span>
      </div>
    </div>

    <div class="menu-group">
      <div class="menu-row clickable" onclick="openAccounts()">
        <span class="menu-icon">⇄</span>
        <span class="menu-name">切换账号</span>
        <span class="menu-arrow">›</span>
      </div>
    </div>
  </section>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item" id="examNav" onclick="showPage('exam')">
      <span class="nav-icon">⌂</span>考试
    </button>
    <button class="nav-item" id="myNav" onclick="showPage('my')">
      <span class="nav-icon">♟</span>我的
    </button>
  </nav>
</div>

<div class="overlay" id="overlay" onclick="closeAccounts()"></div>

<div class="account-sheet" id="accountSheet">
  <div class="handle"></div>
  <div class="sheet-title">切换账号</div>
  <div id="accountList"></div>
  <button class="cancel" onclick="closeAccounts()">取消</button>
</div>

<div class="toast" id="toast"></div>

<script>
const accounts = {
  wang: {
    name:"王橹杰",
    surname:"王",
    school:"重庆市第十一中学校",
    className:"高中2026届1班",
    studentId:"202610010827",
    exam:"高2026届高一（下）三月第一次联合诊断性考试",
    total:611,
    rank:"116/1011",
    scores:[
      ["语文",126,150],
      ["数学",119,150],
      ["英语",132,150],
      ["历史",82,100],
      ["道德与法治",78,100],
      ["地理",74,100]
    ],
    history:[
      "高2026届高一（下）文理分班测试",
      "高2026届高一（上）期末质量检测",
      "2026届重庆金太阳高一联考",
      "高2026届高一（上）期中质量检测",
      "重庆十一中高2026届高一（上）10月适应性检测",
      "重庆十一中2026届入学摸底测试"
    ]
  },
  mu: {
    name:"穆祉丞",
    surname:"穆",
    school:"重庆市第八中学校",
    className:"高三（1）班",
    studentId:"202407111611",
    exam:"高2024届高三（下）三月第一次全市联考",
    total:627,
    rank:"108/1027",
    scores:[
      ["语文",130,150],
      ["数学",125,150],
      ["英语",136,150],
      ["历史",85,100],
      ["道德与法治",79,100],
      ["地理",72,100]
    ],
    history:[
      "重庆市七校联盟高三下期第一次联考",
      "高2024届高三（上）期末质量检测",
      "高2024届重庆八中高三第二次联考",
      "重庆市2024届高三康德联考",
      "高2024届高三（上）期中质量检测",
      "重庆八中2024届高三入学统一测验"
    ]
  }
};

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

let currentAccount = params.get("account")==="mu" ? "mu" : "wang";
let currentPage = "report";
let currentSubject = "英语";
let chartType = "班级";

function user() {
  return accounts[currentAccount];
}

function applyTheme() {
  document.body.classList.remove(
    "theme-wang",
    "theme-mu"
  );

  document.body.classList.add(
    currentAccount === "wang"
      ? "theme-wang"
      : "theme-mu"
  );
}

function toast(message) {
  $("toast").textContent = message;
  $("toast").style.display = "block";
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(()=>{
    $("toast").style.display = "none";
  },1800);
}

function showPage(page) {
  currentPage = page;
  applyTheme();

  ["exam","report","my"].forEach(name=>{
    $(name+"Page").classList.toggle("active",name===page);
  });

  $("pageTitle").textContent =
    page==="exam" ? "考试" :
    page==="my" ? "我的" : "学情报告";

  $("backBtn").style.display =
    page==="report" ? "block" : "none";

  $("bottomNav").style.display =
    page==="report" ? "none" : "flex";

  $("examNav").classList.toggle("active",page==="exam");
  $("myNav").classList.toggle("active",page==="my");

  if(page==="exam") renderExams();
  if(page==="report") renderReport();
  if(page==="my") renderProfile();

  window.scrollTo(0,0);
}

function goBack() {
  showPage("exam");
}

function openCurrentExam() {
  currentSubject = "全科";
  showPage("report");
}

function renderExams() {
  const u = user();

  const names = [u.exam,...u.history];

  $("examList").innerHTML = names.map((name,index)=>`
    <div class="exam-row"
      onclick="${index===0
        ? "openCurrentExam()"
        : "toast('不在查看时间')"}">

      <div class="exam-icon">
        <svg width="25" height="25" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="5" y="3" width="14" height="18" rx="1"/>
          <path d="M8 8h8M8 12h8M8 16h8"/>
        </svg>
      </div>

      <div class="exam-info">
        <div>${name}</div>
        <div class="exam-sub">考试报告</div>
      </div>

      <div class="arrow">›</div>
    </div>
  `).join("");
}

function chooseSubject(name) {
  if(name!=="全科" && name!=="英语") {
    toast("请扫描二维码");
    return;
  }

  currentSubject = name;
  renderReport();
}

function renderReport() {
  const subjects = [
    "全科","语文","数学","英语",
    "历史","道德与法治","地理"
  ];

  $("subjectTabs").innerHTML = subjects.map(name=>`
    <button class="subject-tab
      ${name===currentSubject?"active":""}"
      onclick="chooseSubject('${name}')">
      ${name}
    </button>
  `).join("");

  $("reportContent").innerHTML =
    currentSubject==="全科" ? renderAll() : renderEnglish();

  const active = document.querySelector(".subject-tab.active");
  if(active) {
    active.scrollIntoView({
      block:"nearest",
      inline:"center"
    });
  }
}

function renderAll() {
  const u = user();
  const rank = u.rank.split("/");

  return `
    <div class="report-card">
      <div class="score-label">总分</div>

      <div class="big-score">
        <strong>${u.total}</strong>
        <span class="unit">分</span>
        <span class="full">满分 750</span>
      </div>

      <div class="rank-row">
        <span>年级排名</span>
        <div>
          <strong>${rank[0]}</strong>
          <small> / ${rank[1]}</small>
        </div>
      </div>

      <div class="subject-head">
        <span>科目</span>
        <span style="width:110px">原分/满分</span>
      </div>

      ${u.scores.map(item=>`
        <div class="score-row">
          <span>${item[0]}</span>
          <div class="score-right">
            ${item[1]}
            <span>/${item[2]}</span>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function renderEnglish() {
  const score = user().scores[2][1];

  return `
    <div class="report-card" style="min-height:205px">
      <div class="score-label">英语</div>

      <div class="big-score">
        <strong>${score}</strong>
        <span class="unit">分</span>
        <span class="full">满分 150</span>
      </div>
    </div>

    <div class="report-card">
      <h3 class="card-heading">历次成绩变化</h3>

      <div class="segment">
        <button class="${chartType==="班级"?"active":""}"
          onclick="changeChart('班级')">班级</button>
        <button class="${chartType==="年级"?"active":""}"
          onclick="changeChart('年级')">年级</button>
      </div>

      <div class="grade-bar"></div>

      <div class="grade-labels">
        <span>E等</span>
        <span>D等</span>
        <span>C等</span>
        <span>B等</span>
        <span>A等</span>
      </div>

      <svg class="chart" viewBox="0 0 340 190"
        preserveAspectRatio="none">

        <g stroke="#eeeeee" stroke-width="1">
          <path d="M10 20H330 M10 55H330
                   M10 90H330 M10 125H330 M10 160H330"/>
          <path d="M35 15V165 M110 15V165
                   M185 15V165 M260 15V165"/>
        </g>

function changeChart(type) {
  chartType = type;
  renderReport();
}

function renderProfile() {
  const u = user();

  $("profileAvatar").textContent = u.surname;
  $("profileName").textContent = u.name;
  $("profileSchool").textContent = u.school;
  $("profileClass").textContent = u.className;
  $("profileId").textContent = "学号："+u.studentId;
}

function openAccounts() {
  $("accountList").innerHTML =
    Object.entries(accounts).map(([key,u])=>`
      <button class="account-row"
        onclick="switchAccount('${key}')">

        <div class="account-avatar">${u.surname}</div>

        <div class="account-info">
          <div class="account-name">${u.name}</div>
          <div class="account-school">${u.school}</div>
        </div>

        <div class="account-check
          ${key===currentAccount?"selected":""}">
          ${key===currentAccount?"✓":""}
        </div>
      </button>
    `).join("");

  $("overlay").classList.add("show");
  $("accountSheet").classList.add("show");
}

function closeAccounts() {
  $("overlay").classList.remove("show");
  $("accountSheet").classList.remove("show");
}

function switchAccount(key) {
  currentAccount = key;

  const url = new URL(location.href);
  url.searchParams.set("account",key);
  history.replaceState(null,"",url);

  closeAccounts();
  currentSubject = "英语";
  showPage("my");
}

/* 首次进入默认英语 */
showPage("report");
