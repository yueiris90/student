
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>学情报告 · 模拟演示</title>

<style>
:root {
  --theme:#79bdeb;
  --soft:#e1f3ff;
  --bg:#f1f9ff;
  --line:#e7f0f7;
  --muted:#9aa8b4;
}

body.theme-wang {
  --theme:#79bdeb;
  --soft:#e1f3ff;
  --bg:#f1f9ff;
  --line:#e7f0f7;
  --muted:#9aa8b4;
}

body.theme-mu {
  --theme:#efa2bd;
  --soft:#ffe7f0;
  --bg:#fff4f8;
  --line:#f9e9f0;
  --muted:#b5a0aa;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:#e9eaed;
  color:#292929;
  font-family:
    "Microsoft YaHei",
    "PingFang SC",
    Arial,sans-serif;
}

button {
  font:inherit;
  cursor:pointer;
}

.app {
  width:100%;
  max-width:480px;
  min-height:100vh;
  min-height:100dvh;
  margin:auto;
  background:var(--bg);
  padding-bottom:80px;
}

.header {
  height:56px;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  font-size:18px;
  font-weight:500;
  border-bottom:1px solid var(--line);
}

.back {
  position:absolute;
  left:12px;
  top:0;
  height:56px;
  width:45px;
  border:0;
  background:transparent;
  font-size:32px;
  font-weight:300;
  color:#333;
}

.demo-label {
  font-size:10px;
  text-align:center;
  color:#aaa;
  background:#fff;
  padding:4px 0;
}

.page {
  display:none;
}

.page.active {
  display:block;
}

/* 考试列表 */

.section-title {
  color:var(--muted);
  padding:22px 18px 13px;
  font-size:14px;
}

.exam-list {
  background:#fff;
}

.exam-row {
  display:flex;
  align-items:center;
  gap:14px;
  min-height:91px;
  padding:16px 18px;
  border-bottom:1px solid #f2f2f2;
  cursor:pointer;
}

.exam-icon {
  width:45px;
  height:45px;
  border-radius:10px;
  background:var(--soft);
  color:var(--theme);
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.exam-info {
  flex:1;
  min-width:0;
  font-size:14px;
  line-height:1.6;
}

.exam-sub {
  color:#aaa;
  font-size:12px;
  margin-top:5px;
}

.arrow {
  color:#bbb;
  font-size:23px;
}

.exam-footer {
  text-align:center;
  padding:28px 0;
  color:#aaa;
  font-size:12px;
}

/* 学情报告 */

.subject-tabs {
  display:flex;
  overflow-x:auto;
  white-space:nowrap;
  background:#fff;
  border-bottom:1px solid var(--line);
  scrollbar-width:none;
}

.subject-tabs::-webkit-scrollbar {
  display:none;
}

.subject-tab {
  flex-shrink:0;
  border:0;
  background:transparent;
  padding:16px 19px;
  font-size:15px;
  position:relative;
  color:#333;
}

.subject-tab.active {
  color:var(--theme);
  font-weight:600;
}

.subject-tab.active::after {
  content:"";
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:33px;
  height:3px;
  background:var(--theme);
  border-radius:5px;
}

.report-area {
  padding:13px;
}

.report-card {
  background:#fff;
  border-radius:13px;
  padding:23px;
  margin-bottom:14px;
}

.score-label {
  color:#999;
  font-size:16px;
}

.big-score {
  display:flex;
  align-items:baseline;
  gap:5px;
  margin:19px 0 17px;
}

.big-score strong {
  font-size:65px;
  font-weight:700;
  letter-spacing:-2px;
  color:#191919;
}

.big-score .unit {
  font-size:17px;
}

.big-score .full {
  font-size:15px;
  color:#aaa;
  margin-left:12px;
}

.rank-row {
  border-top:1px solid #eee;
  border-bottom:1px solid #eee;
  padding:20px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.rank-row strong {
  font-size:23px;
}

.rank-row small {
  font-size:14px;
  color:#aaa;
}

.subject-head {
  display:flex;
  justify-content:space-between;
  color:#aaa;
  font-size:14px;
  padding:22px 0 12px;
}

.score-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  height:67px;
  border-bottom:1px solid #f1f1f1;
  font-size:16px;
}

.score-right {
  width:105px;
}

.score-right span {
  color:#aaa;
}

.card-heading {
  font-size:19px;
  font-weight:600;
  margin:0 0 21px;
}

.segment {
  display:flex;
  margin-bottom:22px;
}

.segment button {
  padding:9px 23px;
  border:1px solid var(--theme);
  color:var(--theme);
  background:white;
}

.segment button:first-child {
  border-radius:5px 0 0 5px;
}

.segment button:last-child {
  border-radius:0 5px 5px 0;
}

.segment button.active {
  background:var(--theme);
  color:#fff;
}

.grade-bar {
  height:11px;
  border-radius:20px;
  background:linear-gradient(
    90deg,
    #fa476b,
    #ff9c00,
    #ffd200,
    #8bd044,
    #00bdaf
  );
  margin:15px 8px 5px;
}

.grade-labels {
  display:flex;
  justify-content:space-around;
  font-size:12px;
  color:#555;
}

.chart {
  width:100%;
  height:205px;
  display:block;
  margin-top:20px;
}

.chart-dates {
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#aaa;
}

.chart-note {
  font-size:12px;
  color:var(--theme);
  margin-top:22px;
}

/* 答题卡 */

.paper-image {
  display:block;
  width:100%;
  height:auto;
  border:1px solid #eee;
  border-radius:6px;
  cursor:zoom-in;
}

.paper-tip {
  text-align:center;
  font-size:12px;
  color:#aaa;
  margin-top:13px;
}

.paper-error {
  display:none;
  text-align:center;
  color:#999;
  background:#fafafa;
  padding:35px 10px;
  border:1px dashed #ddd;
  border-radius:8px;
  font-size:13px;
}

/* 我的 */

.my-profile {
  background:#fff;
  padding:28px 20px;
}

.profile-flex {
  display:flex;
  align-items:center;
  gap:15px;
}

.avatar {
  width:65px;
  height:65px;
  border-radius:50%;
  background:var(--soft);
  color:var(--theme);
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:600;
  flex-shrink:0;
}

.profile-name {
  font-size:21px;
  font-weight:600;
}

.student-tag {
  font-size:11px;
  font-weight:400;
  color:var(--theme);
  background:var(--soft);
  border-radius:12px;
  padding:3px 8px;
  margin-left:5px;
}

.profile-detail {
  font-size:12px;
  color:#999;
  margin-top:7px;
}

.menu-group {
  background:#fff;
  margin-top:12px;
}

.menu-row {
  display:flex;
  align-items:center;
  gap:15px;
  min-height:58px;
  padding:0 19px;
  border-bottom:1px solid #f1f1f1;
  font-size:15px;
}

.menu-icon {
  width:25px;
  text-align:center;
  font-size:19px;
  color:#666;
}

.menu-name {
  flex:1;
}

.menu-arrow {
  font-size:22px;
  color:#bbb;
}

.clickable {
  cursor:pointer;
}

/* 底部导航 */

.bottom-nav {
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  height:70px;
  padding-bottom:env(safe-area-inset-bottom);
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  z-index:10;
}

.nav-item {
  flex:1;
  border:0;
  background:transparent;
  color:#aaa;
  font-size:12px;
}

.nav-item.active {
  color:var(--theme);
}

.nav-icon {
  display:block;
  font-size:25px;
  margin-bottom:3px;
}

/* 切换账号 */

.overlay {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:20;
}

.overlay.show {
  display:block;
}

.account-sheet {
  position:fixed;
  left:50%;
  bottom:0;
  transform:translate(-50%,105%);
  width:100%;
  max-width:480px;
  background:#fff;
  border-radius:20px 20px 0 0;
  padding:17px 20px 30px;
  padding-bottom:calc(30px + env(safe-area-inset-bottom));
  z-index:21;
  transition:transform .28s;
}

.account-sheet.show {
  transform:translate(-50%,0);
}

.handle {
  width:38px;
  height:4px;
  background:#ddd;
  border-radius:5px;
  margin:0 auto 19px;
}

.sheet-title {
  text-align:center;
  font-size:17px;
  margin-bottom:13px;
}

.account-row {
  width:100%;
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 0;
  background:white;
  border:0;
  border-bottom:1px solid #f1f1f1;
  text-align:left;
}

.account-avatar {
  width:55px;
  height:55px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--soft);
  color:var(--theme);
  font-size:25px;
  font-weight:600;
}

.account-info {
  flex:1;
}

.account-name {
  font-size:18px;
  font-weight:600;
}

.account-school {
  font-size:12px;
  color:#999;
  margin-top:8px;
}

.account-check {
  width:25px;
  height:25px;
  border:2px solid #ccc;
  border-radius:50%;
}

.account-check.selected {
  background:var(--theme);
  border:0;
  color:#fff;
  display:grid;
  place-items:center;
}

.cancel {
  width:100%;
  border:0;
  background:#f5f6f7;
  color:#555;
  padding:13px;
  border-radius:10px;
  margin-top:19px;
}

/* 提示 */

.toast {
  display:none;
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(35,35,35,.88);
  color:#fff;
  padding:12px 22px;
  border-radius:22px;
  font-size:14px;
  z-index:50;
  white-space:nowrap;
}

/* 图片放大 */

.image-viewer {
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.94);
  align-items:center;
  justify-content:center;
  padding:45px 10px;
}

.image-viewer.show {
  display:flex;
}

.viewer-image {
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

.viewer-close {
  position:absolute;
  top:18px;
  right:18px;
  background:rgba(255,255,255,.2);
  color:#fff;
  border:0;
  border-radius:50%;
  width:40px;
  height:40px;
  font-size:25px;
}

@media(min-width:600px) {
  .app {
    box-shadow:0 0 25px #0000000a;
  }
}
</style>
</head>

<body class="theme-wang">

<div class="app">

  <header class="header">
    <button
      class="back"
      id="backBtn"
      onclick="goBack()">‹</button>

    <span id="pageTitle">学情报告</span>
  </header>

  <div class="demo-label">
    学情报告 · 模拟演示
  </div>

  <!-- 考试列表 -->

  <section class="page" id="examPage">

    <div class="section-title">考试报告</div>

    <div class="exam-list" id="examList"></div>

    <div class="exam-footer">
      仅可查看一学年内考试
    </div>

  </section>

  <!-- 学情报告 -->

  <section class="page active" id="reportPage">

    <div class="subject-tabs" id="subjectTabs"></div>

    <div class="report-area" id="reportContent"></div>

  </section>

  <!-- 我的 -->

  <section class="page" id="myPage">

    <div class="my-profile">
      <div class="profile-flex">

        <div class="avatar" id="profileAvatar"></div>

        <div>
          <div class="profile-name">
            <span id="profileName"></span>
            <span class="student-tag">学生</span>
          </div>

          <div class="profile-detail" id="profileSchool"></div>
          <div class="profile-detail" id="profileClass"></div>
          <div class="profile-detail" id="profileId"></div>
        </div>

      </div>
    </div>

    <div class="menu-group">

      <div class="menu-row">
        <span class="menu-icon">▦</span>
        <span class="menu-name">我的二维码</span>
        <span class="menu-arrow">›</span>
      </div>

      <div class="menu-row">
        <span class="menu-icon">⌖</span>
        <span class="menu-name">收货地址</span>
        <span class="menu-arrow">›</span>
      </div>

    </div>

    <div class="menu-group">

      <div class="menu-row">
        <span class="menu-icon">☏</span>
        <span class="menu-name">客服中心</span>
        <span class="menu-arrow">›</span>
      </div>

      <div class="menu-row">
        <span class="menu-icon">ⓘ</span>
        <span class="menu-name">投诉举报</span>
        <span class="menu-arrow">›</span>
      </div>

      <div class="menu-row">
        <span class="menu-icon">♧</span>
        <span class="menu-name">意见反馈</span>
        <span class="menu-arrow">›</span>
      </div>

    </div>

    <div class="menu-group">
      <div class="menu-row clickable"
           onclick="openAccounts()">

        <span class="menu-icon">⇄</span>
        <span class="menu-name">切换账号</span>
        <span class="menu-arrow">›</span>

      </div>
    </div>

  </section>

  <!-- 底部导航 -->

  <nav class="bottom-nav" id="bottomNav">

    <button class="nav-item"
            id="examNav"
            onclick="showPage('exam')">
      <span class="nav-icon">⌂</span>
      考试
    </button>

    <button class="nav-item"
            id="myNav"
            onclick="showPage('my')">
      <span class="nav-icon">♙</span>
      我的
    </button>

  </nav>

</div>

<!-- 切换账号弹窗 -->

<div class="overlay"
     id="overlay"
     onclick="closeAccounts()"></div>

<div class="account-sheet" id="accountSheet">

  <div class="handle"></div>

  <div class="sheet-title">切换账号</div>

  <div id="accountList"></div>

  <button class="cancel"
          onclick="closeAccounts()">
    取消
  </button>

</div>

<!-- 提示消息 -->

<div class="toast" id="toast"></div>

<!-- 答题卡大图 -->

<div class="image-viewer"
     id="imageViewer"
     onclick="closeImage()">

  <button class="viewer-close"
          onclick="closeImage()">×</button>

  <img class="viewer-image"
       id="viewerImage"
       alt="英语答题卡">

</div>

<script>

/* ==========================
   两个账号的数据
========================== */

const accounts = {

  wang: {
    name:"王橹杰",
    surname:"王",

    school:"重庆市第十一中学校",
    className:"高中2026届1班",
    studentId:"202610010827",

    exam:"高2026届高一（下）三月第一次联合诊断性考试",

    total:611,
    rank:"116/1011",

    englishImage:"wang-english.png",

    scores:[
      ["语文",126,150],
      ["数学",119,150],
      ["英语",132,150],
      ["历史",82,100],
      ["道德与法治",78,100],
      ["地理",74,100]
    ],

    history:[
      "高2026届高一（下）文理分班测试",
      "高2026届高一（上）期末质量检测",
      "2026届重庆金太阳高一联考",
      "高2026届高一（上）期中质量检测",
      "重庆十一中高2026届高一（上）10月适应性检测",
      "重庆十一中2026届入学摸底测试"
    ]
  },

  mu: {
    name:"穆祉丞",
    surname:"穆",

    school:"重庆市第八中学校",
    className:"高三（1）班",
    studentId:"202407111611",

    exam:"高2024届高三（下）三月第一次全市联考",

    total:627,
    rank:"108/1027",

    englishImage:"mu-english.png",

    scores:[
      ["语文",130,150],
      ["数学",125,150],
      ["英语",136,150],
      ["历史",85,100],
      ["道德与法治",79,100],
      ["地理",72,100]
    ],

    history:[
      "重庆市七校联盟高三下期第一次联考",
      "高2024届高三（上）期末质量检测",
      "高2024届重庆八中高三第二次联考",
      "重庆市2024届高三康德联考",
      "高2024届高三（上）期中质量检测",
      "重庆八中2024届高三入学统一测验"
    ]
  }

};

/* ==========================
   基础状态
========================== */

const $ = id => document.getElementById(id);

const params = new URLSearchParams(location.search);

let currentAccount =
  params.get("account")==="mu" ? "mu" : "wang";

let currentPage="report";
let currentSubject="英语";
let chartType="班级";

function user() {
  return accounts[currentAccount];
}

function applyTheme() {

  document.body.classList.remove(
    "theme-wang","theme-mu"
  );

  document.body.classList.add(
    currentAccount==="wang"
      ? "theme-wang"
      : "theme-mu"
  );
}

function themeColor() {
  return currentAccount==="wang"
    ? "#79bdeb"
    : "#efa2bd";
}

/* ==========================
   消息提示
========================== */

function toast(message) {

  $("toast").textContent=message;
  $("toast").style.display="block";

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    $("toast").style.display="none";
  },1800);
}

/* ==========================
   页面切换
========================== */

function showPage(page) {

  currentPage=page;
  applyTheme();

  ["exam","report","my"].forEach(name=>{
    $(name+"Page").classList.toggle(
      "active",name===page
    );
  });

  $("pageTitle").textContent=
    page==="exam" ? "考试" :
    page==="my" ? "我的" : "学情报告";

  $("backBtn").style.display=
    page==="report" ? "block" : "none";

  $("bottomNav").style.display=
    page==="report" ? "none" : "flex";

  $("examNav").classList.toggle(
    "active",page==="exam"
  );

  $("myNav").classList.toggle(
    "active",page==="my"
  );

  if(page==="exam") renderExams();
  if(page==="report") renderReport();
  if(page==="my") renderProfile();

  window.scrollTo(0,0);
}

function goBack() {
  showPage("exam");
}

function openCurrentExam() {
  currentSubject="全科";
  showPage("report");
}

/* ==========================
   考试列表
========================== */

function renderExams() {

  const u=user();
  const names=[u.exam,...u.history];

  $("examList").innerHTML=names.map((name,index)=>`

    <div class="exam-row"
         onclick="${index===0
           ? "openCurrentExam()"
           : "toast('不在查看时间')"}">

      <div class="exam-icon">

        <svg width="25" height="25"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.8">

          <rect x="5" y="3"
                width="14" height="18" rx="1"/>

          <path d="M8 8h8 M8 12h8 M8 16h8"/>

        </svg>

      </div>

      <div class="exam-info">
        <div>${name}</div>
        <div class="exam-sub">考试报告</div>
      </div>

      <div class="arrow">›</div>

    </div>

  `).join("");
}

/* ==========================
   科目导航
========================== */

function chooseSubject(name) {

  if(name!=="全科" && name!=="英语") {

    toast("请扫描条形码");
    return;

  }

  currentSubject=name;
  renderReport();
}

function renderReport() {

  const subjects=[
    "全科","语文","数学","英语",
    "历史","道德与法治","地理"
  ];

  $("subjectTabs").innerHTML=subjects.map(name=>`

    <button
      class="subject-tab
        ${name===currentSubject?"active":""}"
      onclick="chooseSubject('${name}')">

      ${name}

    </button>

  `).join("");

  $("reportContent").innerHTML=
    currentSubject==="全科"
      ? renderAll()
      : renderEnglish();

  const active=document.querySelector(
    ".subject-tab.active"
  );

  if(active) {

    active.scrollIntoView({
      block:"nearest",
      inline:"center"
    });

  }
}

/* ==========================
   全科报告
========================== */

function renderAll() {

  const u=user();
  const rank=u.rank.split("/");

  return `

    <div class="report-card">

      <div class="score-label">总分</div>

      <div class="big-score">
        <strong>${u.total}</strong>
        <span class="unit">分</span>
        <span class="full">满分 750</span>
      </div>

      <div class="rank-row">

        <span>年级排名</span>

        <div>
          <strong>${rank[0]}</strong>
          <small> / ${rank[1]}</small>
        </div>

      </div>

      <div class="subject-head">
        <span>科目</span>
        <span style="width:105px">原分/满分</span>
      </div>

      ${u.scores.map(item=>`

        <div class="score-row">

          <span>${item[0]}</span>

          <div class="score-right">
            ${item[1]}
            <span>/${item[2]}</span>
          </div>

        </div>

      `).join("")}

    </div>

  `;
}

/* ==========================

function changeChart(type) {
  chartType=type;
  renderReport();
}

/* ==========================
   答题卡放大
========================== */

function openImage(src) {

  $("viewerImage").src=src;

  $("imageViewer").classList.add("show");

  document.body.style.overflow="hidden";
}

function closeImage() {

  $("imageViewer").classList.remove("show");

  $("viewerImage").removeAttribute("src");

  document.body.style.overflow="";
}

/* ==========================
   我的页面
========================== */

function renderProfile() {

  const u=user();

  $("profileAvatar").textContent=u.surname;

  $("profileName").textContent=u.name;

  $("profileSchool").textContent=u.school;

  $("profileClass").textContent=u.className;

  $("profileId").textContent=
    "学号："+u.studentId;
}

/* ==========================
   切换账号
========================== */

function openAccounts() {

  $("accountList").innerHTML=
    Object.entries(accounts).map(([key,u])=>`

      <button
        class="account-row"
        onclick="switchAccount('${key}')">

        <div class="account-avatar">
          ${u.surname}
        </div>

        <div class="account-info">

          <div class="account-name">
            ${u.name}
          </div>

          <div class="account-school">
            ${u.school}
          </div>

        </div>

        <div class="account-check
          ${key===currentAccount?"selected":""}">

          ${key===currentAccount?"✓":""}

        </div>

      </button>

    `).join("");

  $("overlay").classList.add("show");

  $("accountSheet").classList.add("show");
}

function closeAccounts() {

  $("overlay").classList.remove("show");

  $("accountSheet").classList.remove("show");
}

function switchAccount(key) {

  if(!accounts[key]) return;

  currentAccount=key;

  const url=new URL(location.href);

  url.searchParams.set("account",key);

  history.replaceState(null,"",url);

  closeAccounts();

  currentSubject="英语";
  chartType="班级";

  showPage("my");
}

/* ==========================
   首次打开默认英语报告
========================== */

showPage("report");

</script>
